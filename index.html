<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rahulranks Color Palette Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 32px;
      max-width: 900px;
      margin: auto;
    }

    .color-item {
      text-align: center;
    }

    .circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 12px;
      border: 1px solid #ccc;
    }

    .label {
      font-size: 14px;
      font-weight: 600;
      color: #222;
    }

    .hex {
      font-size: 13px;
      color: #555;
    }

    /* Rahulranks Color Palette */
    .bg-main        { background-color: #F9D9AC; }
    .bg-surface     { background-color: #FFF9F0; }
    .bg-surface-alt { background-color: #F3E6D4; }
    .text-primary   { background-color: #1C1A17; }
    .text-muted     { background-color: #6F6252; }
    .accent         { background-color: #2563EB; }
    .border-subtle  { background-color: #E2D3BD; }
  </style>
</head>
<body>

  <div class="palette">

    <div class="color-item">
      <div class="circle bg-main"></div>
      <div class="label">bg-main</div>
      <div class="hex">#F9D9AC</div>
    </div>

    <div class="color-item">
      <div class="circle bg-surface"></div>
      <div class="label">bg-surface</div>
      <div class="hex">#FFF9F0</div>
    </div>

    <div class="color-item">
      <div class="circle bg-surface-alt"></div>
      <div class="label">bg-surface-alt</div>
      <div class="hex">#F3E6D4</div>
    </div>

    <div class="color-item">
      <div class="circle text-primary"></div>
      <div class="label">text-primary</div>
      <div class="hex">#1C1A17</div>
    </div>

    <div class="color-item">
      <div class="circle text-muted"></div>
      <div class="label">text-muted</div>
      <div class="hex">#6F6252</div>
    </div>

    <div class="color-item">
      <div class="circle accent"></div>
      <div class="label">accent</div>
      <div class="hex">#2563EB</div>
    </div>

    <div class="color-item">
      <div class="circle border-subtle"></div>
      <div class="label">border-subtle</div>
      <div class="hex">#E2D3BD</div>
    </div>

  </div>

</body>
</html>
